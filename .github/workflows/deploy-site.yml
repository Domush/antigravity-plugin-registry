name: Deploy Web Portal

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: registry-crawl-and-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site source (main)
        uses: actions/checkout@v4

      - name: Checkout latest published JSON (registry-data)
        run: |
          mkdir -p ./pages-dist
          rc=0
          git ls-remote --exit-code --heads origin registry-data >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch origin registry-data:registry-data
            git worktree add ./registry-data registry-data
            cp -r ./registry-data/public/. ./pages-dist/
          elif [ "$rc" -eq 2 ]; then
            echo "Remote branch registry-data does not exist yet; deploying site without registry JSON."
          else
            echo "Failed to probe remote registry-data branch (git ls-remote exit code: $rc)." >&2
            exit "$rc"
          fi
          cp -r ./site/. ./pages-dist/
          touch ./pages-dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
